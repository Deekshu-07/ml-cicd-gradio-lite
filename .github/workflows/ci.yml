name: Drug Classification CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format Python code
        run: black train.py

      - name: Train and evaluate model
        run: python train.py

      - name: Upload model and evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: drug-classification-results
          path: |
            model/
            results/
