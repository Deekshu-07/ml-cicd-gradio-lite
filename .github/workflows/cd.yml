name: Deploy Drug Classification to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade huggingface_hub

      - name: Format Python code
        run: black train.py

      - name: Train model and export ONNX
        run: python train.py

      - name: Deploy website and model to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          hf upload "$HF_SPACE_ID" app/README.md README.md --repo-type space
          hf upload "$HF_SPACE_ID" app/index.html index.html --repo-type space
          hf upload "$HF_SPACE_ID" model/drug_model.onnx drug_model.onnx --repo-type space
          hf upload "$HF_SPACE_ID" results/metrics.txt results/metrics.txt --repo-type space
          hf upload "$HF_SPACE_ID" results/confusion_matrix.png results/confusion_matrix.png --repo-type space

